---
- name: Configure Azure VM — Task Manager
  hosts: vm
  become: true

  vars:
    ghcr_user: "OWNER"                              # à surcharger via -e
    ghcr_token: ""                                   # optionnel (image publique)
    app_image: "ghcr.io/{{ ghcr_user }}/usine-logiciel:latest"
    app_port: 5000
    grafana_port: 3000
    prometheus_port: 9090
    grafana_admin_password: "admin123"

  roles:
    - docker
    - deploy
