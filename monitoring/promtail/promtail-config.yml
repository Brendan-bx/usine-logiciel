server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs de tous les conteneurs Docker
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}

  # Fichier de log applicatif
  - job_name: app
    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          app: taskmanager
          __path__: /var/log/app/*.log
